name: RUPAAI quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rupaai-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build production assets
        run: npm run build
      - name: Verify built entry point
        run: test -s dist/index.html
