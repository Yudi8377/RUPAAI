name: RUPAAI iOS simulator build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-simulator.yml'

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Generate iOS project
        run: npx cap add ios
      - name: Add camera permission explanation
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'RUPAAI uses the camera to preview hair color on this device.'" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'RUPAAI uses the camera to preview hair color on this device.'" ios/App/App/Info.plist
      - name: Sync native assets
        run: npx cap sync ios
      - name: Build iOS simulator app without signing
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: rupaai-ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 14
